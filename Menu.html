<script>

window.addEventListener("DOMContentLoaded", () => {

    setTimeout(() => {
        document.getElementById("loader").style.display = "none";
    }, 2000);

    const user = JSON.parse(localStorage.getItem("currentUser"));

    if(!user){
        window.location.href = "index.html";
        return;
    }

    // 🔐 ATUALIZA UI
    const userIdEl = document.getElementById("userId");
    const userPlanEl = document.getElementById("userPlan");

    if(userIdEl) userIdEl.innerText = user.id;
    if(userPlanEl) userPlanEl.innerText = user.plan;

    // ===== CONTROLE DE ACESSO =====
    function applyPermissions(){

        const cards = document.querySelectorAll(".card");

        const download = cards[0];
        const tools = cards[1];
        const status = cards[2];
        const support = cards[3];

        // 🆓 FREE
        if(user.plan === "FREE"){
            tools.classList.add("locked");
            status.classList.add("locked");
            support.classList.add("locked");
            return;
        }

        // 💳 VIP
        if(user.plan.includes("VIP")){
            cards.forEach(c => c.classList.remove("locked"));
        }
    }

    applyPermissions();

    // contador fake
    setInterval(() => {
        let random = Math.floor(Math.random() * 80) + 90;
        const online = document.getElementById("online");
        if(online) online.innerText = random;
    }, 3000);

});

// navegação
function downloads(){
    window.location.href = "Download.html";
}

function tools(){

    const user = JSON.parse(localStorage.getItem("currentUser"));

    if(user.plan === "FREE"){
        alert("Área exclusiva para VIP");
        return;
    }

    window.location.href = "Tools.html";
}

function voltarPagina(){
    localStorage.removeItem("currentUser");
    window.location.href = "Index.html";
}

</script>
