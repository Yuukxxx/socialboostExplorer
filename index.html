<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAXCOD LOGIN</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: url('https://look.jmgbb.com/images/gs5fFNPoOE.png') no-repeat center center;
    background-size: cover;
    font-family: 'Courier New', monospace;
    color: #00ffcc;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    background: rgba(15,15,15,0.60);
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 30px #00ffcc22;
    backdrop-filter: blur(3px);
}

h1 {
    margin-bottom: 5px;
    letter-spacing: 4px;
    font-size: 28px;
    text-shadow: 0 0 10px #00ffcc88;
}

.sub {
    color: #ccc;
    font-size: 13px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    background: rgba(0,0,0,0.65);
    color: #00ffcc;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #00ffcc;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #00ffaa;
    transform: scale(1.02);
}

#loading {
    display: none;
    margin-top: 10px;
    font-size: 12px;
    color: #00ffaa;
}

#msg {
    display: none;
    margin-top: 10px;
    font-size: 12px;
    color: #00ff88;
}

/* painel fake pagamento */
.pagamento {
    margin-top: 25px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 20px;
}

.pagamento strong {
    color: #00ffcc;
}

.pagamento img {
    width: 140px;
    margin: 20px auto 10px;
    display: block;
}

.pix {
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    word-break: break-all;
}

.copy {
    background: #00ffaa;
    margin-top: 10px;
}

.whats {
    background: #25D366;
    color: #000;
}
</style>
</head>

<body>

<div class="box">

    <h1>HAXCOD</h1>
    <div class="sub">Área de acesso</div>

    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">

    <button onclick="entrar()">Acessar</button>

    <div id="loading">Validando acesso...</div>
    <div id="msg">Acesso liberado ✔</div>

    <!-- PIX FAKE VISUAL -->
    <div class="pagamento">

        <p><strong>Plano Premium</strong></p>

        <p style="font-size:12px;color:#ddd;">
            Após acesso, planos são ativados automaticamente.
        </p>

        <img src="https://look.jmgbb.com/images/NjUON6THRC.png">

        <div class="pix">
            pix-haxcod@email.com
        </div>

        <button class="copy" onclick="copiarPix()">Copiar Pix</button>
        <button class="whats" onclick="whats()">Enviar comprovante</button>

    </div>

</div>

<script>

// 🧠 BANCO DE USUÁRIOS (FAKE LOCAL)
const usersDB = {
    "free01": { pass: "111", plan: "FREE" },
    "vip1": { pass: "222", plan: "VIP 1 MES" },
    "vip3": { pass: "333", plan: "VIP 3 MESES" },
    "vip12": { pass: "444", plan: "VIP 1 ANO" }
};

function entrar() {

    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    if(!user || !pass){
        alert("Preencha tudo");
        return;
    }

    document.getElementById("loading").style.display = "block";

    setTimeout(() => {

        let data = usersDB[user];

        if(data && data.pass === pass){

            // salva sessão
            localStorage.setItem("currentUser", JSON.stringify({
                id: user,
                plan: data.plan
            }));

            document.getElementById("loading").style.display = "none";
            document.getElementById("msg").style.display = "block";

            // redireciona pro hub
            setTimeout(() => {
                window.location.href = "Menu.html";
            }, 800);

        } else {

            document.getElementById("loading").style.display = "none";
            alert("Login inválido");

        }

    }, 1000);
}

// copiar pix
function copiarPix(){
    navigator.clipboard.writeText("pix-haxcod@email.com");
    alert("Pix copiado!");
}

// whatsapp
function whats(){
    window.open("https://wa.me/5511999999999?text=Comprovante%20de%20pagamento");
}

</script>

</body>
</html>
