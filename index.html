<script>

// LOGIN CRIPTOGRAFADO BASE64
const encodedUser = "SGF4MTAx";
const encodedPass = "MTAxMDE=";

// DECODIFICA
function decode(text){
    return atob(text);
}

function entrar(){

    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    const loading = document.getElementById("loading");
    const msg = document.getElementById("msg");

    msg.style.display = "none";

    if(user === "" || pass === ""){
        alert("Preencha tudo");
        return;
    }

    loading.style.display = "block";

    setTimeout(() => {

        // LOGIN REAL
        const realUser = decode(encodedUser);
        const realPass = decode(encodedPass);

        // VERIFICA
        if(user === realUser && pass === realPass){

            // SESSÃO
            localStorage.setItem("currentUser", btoa(JSON.stringify({
                id: user,
                level: "admin"
            })));

            loading.style.display = "none";
            msg.style.display = "block";

            // REDIRECT
            setTimeout(() => {

                window.location.href = "Menu.html";

            }, 1000);

        } else {

            loading.style.display = "none";

            alert("Acesso negado");

        }

    }, 1200);
}

// ENTER
document.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        entrar();
    }

});

// DESATIVA CLICK DIREITO
document.addEventListener("contextmenu", e => e.preventDefault());

// BLOQUEIA F12 / INSPECIONAR
document.onkeydown = function(e){

    if(
        e.keyCode == 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 73) ||
        (e.ctrlKey && e.keyCode == 85)
    ){
        return false;
    }

};

</script>
