<script>

async function entrar(){

    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    const loading = document.getElementById("loading");
    const msg = document.getElementById("msg");

    if(user === "" || pass === ""){
        alert("Preencha tudo");
        return;
    }

    loading.style.display = "block";
    msg.style.display = "none";

    try{

        // CARREGA JSON
        const response = await fetch("Logins.json");

        // TESTA SE EXISTE
        if(!response.ok){

            throw new Error("Arquivo não encontrado");

        }

        // CONVERTE JSON
        const database = await response.json();

        // PROCURA LOGIN
        const account = database.users.find(function(acc){

            return acc.id === user && acc.pass === pass;

        });

        setTimeout(function(){

            if(account){

                // SALVA
                localStorage.setItem("user", account.id);
                localStorage.setItem("plan", account.plan);

                loading.style.display = "none";
                msg.style.display = "block";

                // REDIRECT
                setTimeout(function(){

                    window.location.href = "Menu.html";

                }, 800);

            }else{

                loading.style.display = "none";

                alert("Login inválido");

            }

        }, 1000);

    }catch(error){

        loading.style.display = "none";

        console.error(error);

        alert("Erro ao carregar Logins.json");

    }

}

// ENTER
document.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        entrar();
    }

});

</script>
