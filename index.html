<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAXCOD LOGIN</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: url('https://look.jmgbb.com/images/gs5fFNPoOE.png') no-repeat center center;
    background-size: cover;
    font-family: 'Courier New', monospace;
    color: #00ffcc;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    background: rgba(15,15,15,0.65);
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 30px #00ffcc22;
}

h1 {
    margin-bottom: 5px;
    letter-spacing: 4px;
}

.sub {
    color: #ccc;
    font-size: 13px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: rgba(0,0,0,0.7);
    color: #00ffcc;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #00ffcc;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00ffaa;
}

#loading {
    display: none;
    margin-top: 10px;
    font-size: 12px;
}

#msg {
    display: none;
    margin-top: 10px;
    font-size: 12px;
    color: #00ff88;
}
</style>
</head>

<body>

<div class="box">

    <h1>HAXCOD</h1>
    <div class="sub">Área restrita</div>

    <input type="text" id="user" placeholder="Usuário (ID)">
    <input type="password" id="pass" placeholder="Senha">

    <button onclick="login()">ENTRAR</button>

    <div id="loading">Verificando acesso...</div>
    <div id="msg">Login autorizado</div>

</div>

<script>

// 🧠 BASE DE USUÁRIOS
const users = [
  { id: "FREE-001", pass: "free", plan: "FREE" },

  { id: "VIP1-AX91", pass: "1010", plan: "VIP 1 MÊS" },
  { id: "VIP5-QW88", pass: "2020", plan: "VIP 5 MESES" },
  { id: "VIP12-YZ99", pass: "3030", plan: "VIP 1 ANO" }
];

function login(){

    let user = document.getElementById("user").value.trim();
    let pass = document.getElementById("pass").value.trim();

    if(!user || !pass){
        alert("Preencha todos os campos");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("msg").style.display = "none";

    setTimeout(() => {

        const found = users.find(u => u.id === user && u.pass === pass);

        if(!found){
            document.getElementById("loading").style.display = "none";
            alert("Usuário ou senha inválidos");
            return;
        }

        // 💾 salva sessão
        localStorage.setItem("currentUser", JSON.stringify(found));

        document.getElementById("loading").style.display = "none";
        document.getElementById("msg").style.display = "block";

        // redireciona
        setTimeout(() => {
            window.location.href = "hub.html";
        }, 800);

    }, 1000);
}

</script>

</body>
</html>
