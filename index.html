<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAXCOD</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    font-family: 'Courier New', monospace;
    color: #00ffcc;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* container */
.box {
    background: rgba(15,15,15,0.95);
    padding: 40px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 30px #00ffcc22;
}

/* título */
h1 {
    margin-bottom: 5px;
    letter-spacing: 4px;
    font-size: 28px;
}

.sub {
    color: #888;
    font-size: 13px;
    margin-bottom: 25px;
}

/* inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    background: #111;
    color: #00ffcc;
    outline: none;
    transition: 0.2s;
}

input:focus {
    box-shadow: 0 0 10px #00ffcc55;
}

/* botão */
button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #00ffcc;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #00ffaa;
}

/* loading */
#loading {
    display: none;
    margin-top: 15px;
    font-size: 12px;
    color: #00ffaa;
    animation: blink 1s infinite;
}

/* sucesso */
#msg {
    display: none;
    margin-top: 15px;
    font-size: 12px;
}

@keyframes blink {
    50% { opacity: 0.3; }
}
</style>

</head>
<body>

<div class="box">
    <h1>HAXCOD</h1>
    <div class="sub">Acesso exclusivo ao sistema</div>

    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div id="loading">Verificando credenciais...</div>
    <div id="msg">Acesso liberado. Redirecionando...</div>
</div>

<script>
function entrar() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    if(user === "" || pass === "") {
        alert("Preencha todos os campos");
        return;
    }

    document.getElementById("loading").style.display = "block";

    setTimeout(() => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("msg").style.display = "block";
    }, 2500);
}
</script>

</body>
</html>
